{% load static %}
<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexaChat</title>

    <link rel="stylesheet" href="{% static 'App_Principal/css/base.css' %}">

    {% block extra_css %}
    {% endblock %}
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            <a href="{% url 'home' %}">
                <h2>N<span>C</span></h2>
            </a>
        </div>

        <nav>

            <a href="{% url 'home' %}">
                🏠
            </a>

            <a href="{% url 'chats' %}">
                💬
            </a>

            <a href="{% url 'explore' %}">
                🔍
            </a>

            <a href="{% url 'music_home' %}">
                🎵
            </a>

            <a href="{% url 'notifications' %}">
                🔔
            </a>

            <a href="{% url 'profile' request.user.username %}">
                👤
            </a>

            <a href="{% url 'settings' %}">
                ⚙
            </a>

        </nav>

    </aside>

    <main class="contenido {% block content_class %}{% endblock %}">

        {% block content %}
        {% endblock %}

    </main>

</div>

<script src="{% static 'App_Principal/js/base.js' %}"></script>

{% block extra_js %}{% endblock %}

</body>

</html>
