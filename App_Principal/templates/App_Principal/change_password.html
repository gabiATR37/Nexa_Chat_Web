{% extends "base_app.html" %}

{% block title %}
Cambiar contraseña
{% endblock %}

{% block content %}

<div class="password-page">

    <div class="password-card">

        <h1>Cambiar contraseña</h1>
        <p>Actualiza tu contraseña para mantener tu cuenta segura.</p>

        <form method="post" class="password-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Guardar contraseña
            </button>
        </form>

    </div>

</div>

{% endblock %}
