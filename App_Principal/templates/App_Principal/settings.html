{% extends "base_app.html" %}

{% block title %}
Configuración - NexaChat
{% endblock %}

{% block content %}

<div class="Settings">

    <h1>⚙ Configuración</h1>

    <!-- Cuenta -->
    <section class="Settings-Card">
        <h2>👤 Cuenta</h2>

        <a href="{% url 'edit_profile' %}">Editar perfil</a>
        <a href="{% url 'change_password' %}">Cambiar contraseña</a>
    </section>

    <!-- Privacidad -->
    <section class="Settings-Card">
        <h2>🔒 Privacidad</h2>

        <label>
            <input type="checkbox">
            Perfil privado
        </label>

        <label>
            <input type="checkbox">
            Permitir mensajes
        </label>



    <!-- Seguridad -->
    <section class="Settings-Card">
        <h2>🛡 Seguridad</h2>

        <button class="Danger">
            Cerrar todas las sesiones
        </button>
    </section>

    <!-- Sesión -->
    <section class="Settings-Card">
        <h2>🚪 Sesión</h2>

        <a href="{% url 'logout' %}" class="Logout">
            Cerrar sesión
        </a>
    </section>

</div>

{% endblock %}
